# Tests use in-memory H2 in PostgreSQL mode, so no Docker needed.
# This file replaces src/main/resources/application.properties during tests.
spring.datasource.url=jdbc:h2:mem:travelpal;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
