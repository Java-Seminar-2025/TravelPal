spring.application.name=travelpal

# Database (matches compose.yaml; Docker overrides the URL via SPRING_DATASOURCE_URL)
spring.datasource.url=jdbc:postgresql://localhost:5432/travelpal
spring.datasource.username=travelpal
spring.datasource.password=password

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# db/dev holds test users and plans for local development.
# In production set SPRING_FLYWAY_LOCATIONS=classpath:db/migration so they are never created.
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Local dev: Spring Boot starts the `db` service from compose.yaml automatically
spring.docker.compose.lifecycle-management=start-only

# External APIs (wired up later)
travelpal.api.mock=${API_MOCK:true}
travelpal.tripadvisor.api-key=${TRIPADVISOR_API_KEY:}
travelpal.gemini.api-key=${GEMINI_API_KEY:}
