spring.application.name=travelpal

# Database (defaults match compose.yaml; override via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travelpal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:travelpal}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:travelpal}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Local dev: Spring Boot starts the `db` service from compose.yaml automatically
spring.docker.compose.lifecycle-management=start-only

# External APIs (wired up later)
travelpal.api.mock=${API_MOCK:true}
travelpal.tripadvisor.api-key=${TRIPADVISOR_API_KEY:}
travelpal.gemini.api-key=${GEMINI_API_KEY:}
