<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Shared page parts. Use with th:replace="~{fragments :: head('Title')}" and ~{fragments :: navbar} -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · TravelPal'">TravelPal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<nav th:fragment="navbar" class="navbar navbar-expand bg-white border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">TravelPal</a>
        <div class="d-flex align-items-center gap-2">
            <th:block sec:authorize="isAnonymous()">
                <a class="btn btn-outline-primary btn-sm" th:href="@{/login}">Log in</a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">Sign up</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <a sec:authorize="hasRole('ADMIN')" class="btn btn-link btn-sm" th:href="@{/admin}">Admin</a>
                <span class="text-secondary small" sec:authentication="name">user</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-secondary btn-sm" type="submit">Log out</button>
                </form>
            </th:block>
        </div>
    </div>
</nav>
</html>
