<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Home')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-5 text-center">
    <h1 class="display-4">TravelPal</h1>
    <p class="lead">Plan it, share it, play it.</p>
    <p sec:authorize="isAuthenticated()">Welcome back, <strong sec:authentication="name">user</strong>!</p>
    <div sec:authorize="isAnonymous()">
        <a class="btn btn-primary" th:href="@{/register}">Create an account</a>
    </div>
</main>
</body>
</html>
