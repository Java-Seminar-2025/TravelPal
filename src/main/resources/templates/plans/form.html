<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Used for both "new plan" and "edit plan": planId is only set when editing. -->
<head th:replace="~{fragments :: head('Plan')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<main class="container" style="max-width: 640px">
    <h1 class="h3 mb-3" th:text="${planId == null ? 'Create Travel Plan' : 'Edit Travel Plan'}">Create Travel Plan</h1>

    <form th:action="${planId == null} ? @{/plans} : @{/plans/{id}/edit(id=${planId})}"
          th:object="${planForm}" method="post" class="card card-body" novalidate>
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input th:field="*{title}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>

        <!-- City picker: type, press Find, pick a result. plan-form.js fills the hidden coordinates. -->
        <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <div class="input-group">
                <input th:field="*{city}" class="form-control" th:errorclass="is-invalid" placeholder="e.g. Pisa" autocomplete="off">
                <button id="city-find" class="btn btn-outline-primary" type="button">Find</button>
            </div>
            <input type="hidden" th:field="*{cityLatitude}">
            <input type="hidden" th:field="*{cityLongitude}">
            <div class="small text-danger mt-1" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
            <div class="small text-danger mt-1" th:if="${#fields.hasErrors('cityLatitude')}" th:errors="*{cityLatitude}"></div>
            <div id="city-results" class="list-group mt-2"></div>
            <div id="city-status" class="small text-muted mt-1"></div>
            <div id="city-map" class="border rounded mt-2" style="height: 240px"></div>
        </div>

        <div class="mb-3">
            <label for="days" class="form-label">Days</label>
            <input th:field="*{days}" type="number" min="1" max="60" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{days}"></div>
        </div>

        <div class="mb-3">
            <label for="visibility" class="form-label">Visibility</label>
            <select th:field="*{visibility}" class="form-select">
                <option value="PRIVATE">PRIVATE</option>
                <option value="PUBLIC">PUBLIC</option>
            </select>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a class="btn btn-outline-secondary" th:href="${planId == null} ? @{/plans} : @{/plans/{id}(id=${planId})}">Cancel</a>
            <button class="btn btn-primary" type="submit">Save Plan</button>
        </div>
    </form>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script th:src="@{/js/plan-form.js}"></script>
</body>
</html>
