<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container" style="max-width: 420px">
    <h1 class="h3 mb-3">Log in</h1>

    <div th:if="${param.registered}" class="alert alert-success">Account created. You can log in now.</div>
    <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
    <div th:if="${param.error}" class="alert alert-danger">Wrong username/email or password.</div>

    <form th:action="@{/login}" method="post" class="card card-body">
        <div class="mb-3">
            <label for="username" class="form-label">Username or email</label>
            <input id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="mt-3 text-center">No account yet? <a th:href="@{/register}">Sign up</a></p>
</main>
</body>
</html>
