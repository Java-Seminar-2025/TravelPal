<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3">Users</h1>
    <div class="table-responsive">
        <table class="table table-sm bg-white border">
            <thead><tr><th>Username</th><th>Email</th><th>Role</th><th>XP</th><th>Joined</th></tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.username}">name</td>
                <td th:text="${u.email}">mail</td>
                <td th:text="${u.role}">USER</td>
                <td th:text="${u.xp}">0</td>
                <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">date</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
