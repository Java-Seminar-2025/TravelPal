services:
  db:
    image: postgres:15-alpine
    container_name: travelpal-db
    environment:
      POSTGRES_DB: travelpal
      POSTGRES_USER: travelpal
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/travelpal
      SPRING_DATASOURCE_USERNAME: travelpal
      SPRING_DATASOURCE_PASSWORD: travelpal
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      API_MOCK: ${API_MOCK:-true}
      TRIPADVISOR_API_KEY: ${TRIPADVISOR_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
volumes:
  postgres_data:
    driver: local