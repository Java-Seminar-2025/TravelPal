services:
  db:
    image: postgres:15-alpine
    container_name: travelpal-db
    environment:
      POSTGRES_DB: travelpal
      POSTGRES_USER: travelpal
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - travelpal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelpal -d travelpal"]
      interval: 5s
      retries: 12
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travelpal
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      API_MOCK: ${API_MOCK:-true}
      TRIPADVISOR_API_KEY: ${TRIPADVISOR_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
volumes:
  # All database data (users, plans, ...) lives here and survives restarts and `docker compose down`.
  # Only `docker compose down -v` deletes it.
  travelpal-data:
    name: travelpal-data
